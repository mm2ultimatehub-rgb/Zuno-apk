name: ZUNO Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "icon.svg"
      - "manifest.webmanifest"
      - "sw.js"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "scripts/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Install web and Capacitor dependencies
        run: npm install
      - name: Prepare web app
        run: npm run prepare:web
      - name: Stamp native app version for update checker
        env:
          VERSION_NAME: 0.2.${{ github.run_number }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'www/index.html';
          let html = await readFile(path, 'utf8');
          const version = process.env.VERSION_NAME;
          if (!version || !/^\d+\.\d+\.\d+$/.test(version)) {
            throw new Error('Invalid VERSION_NAME: ' + version);
          }
          const pattern = /(<meta\s+name="zuno-app-version"\s+content=")[^"]*(")/i;
          if (!pattern.test(html)) throw new Error('zuno-app-version meta tag missing');
          html = html.replace(pattern, (_match, prefix, suffix) => prefix + version + suffix);
          await writeFile(path, html);
          console.log('Stamped native web bundle with ZUNO ' + version);
          NODE
      - name: Generate native Android project
        run: npx cap add android
      - name: Sync native project
        run: npx cap sync android
      - name: Configure release signing
        env:
          ZUNO_KEYSTORE_BASE64: ${{ secrets.ZUNO_KEYSTORE_BASE64 }}
          ZUNO_KEYSTORE_PASSWORD: ${{ secrets.ZUNO_KEYSTORE_PASSWORD }}
          ZUNO_KEY_ALIAS: ${{ secrets.ZUNO_KEY_ALIAS }}
          ZUNO_KEY_PASSWORD: ${{ secrets.ZUNO_KEY_PASSWORD }}
        run: |
          test -n "$ZUNO_KEYSTORE_BASE64" || (echo "::error::Missing ZUNO_KEYSTORE_BASE64 GitHub Secret"; exit 1)
          test -n "$ZUNO_KEYSTORE_PASSWORD" || (echo "::error::Missing ZUNO_KEYSTORE_PASSWORD GitHub Secret"; exit 1)
          test -n "$ZUNO_KEY_ALIAS" || (echo "::error::Missing ZUNO_KEY_ALIAS GitHub Secret"; exit 1)
          test -n "$ZUNO_KEY_PASSWORD" || (echo "::error::Missing ZUNO_KEY_PASSWORD GitHub Secret"; exit 1)
          echo "$ZUNO_KEYSTORE_BASE64" | base64 --decode > android/app/zuno-release.keystore
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="0.2.${GITHUB_RUN_NUMBER}"
          cat >> android/app/build.gradle <<GRADLE
          android {
              defaultConfig {
                  versionCode ${VERSION_CODE}
                  versionName "${VERSION_NAME}"
              }
          }
          GRADLE
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  zunoRelease {
                      storeFile file("zuno-release.keystore")
                      storePassword System.getenv("ZUNO_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ZUNO_KEY_ALIAS")
                      keyPassword System.getenv("ZUNO_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.zunoRelease
                  }
              }
          }
          GRADLE
      - name: Build signed release APK
        env:
          ZUNO_KEYSTORE_PASSWORD: ${{ secrets.ZUNO_KEYSTORE_PASSWORD }}
          ZUNO_KEY_ALIAS: ${{ secrets.ZUNO_KEY_ALIAS }}
          ZUNO_KEY_PASSWORD: ${{ secrets.ZUNO_KEY_PASSWORD }}
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Verify APK signature and version metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -f "$APK" || { echo "::error::Release APK was not produced"; exit 1; }
          test -x "$APKSIGNER" || { echo "::error::apksigner is unavailable"; exit 1; }
          test -x "$AAPT" || { echo "::error::aapt is unavailable"; exit 1; }

          # Fail the release before upload if APK is unsigned or its embedded
          # application/version metadata does not match this workflow run.
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | grep -m1 '^package:')"
          PACKAGE_NAME="$(printf '%s\n' "$PACKAGE_LINE" | sed -E "s/.*name='([^']+)'.*/\\1/")"
          APK_VERSION_CODE="$(printf '%s\n' "$PACKAGE_LINE" | sed -E "s/.*versionCode='([^']+)'.*/\\1/")"
          APK_VERSION_NAME="$(printf '%s\n' "$PACKAGE_LINE" | sed -E "s/.*versionName='([^']+)'.*/\\1/")"
          EXPECTED_CODE="$((1000 + GITHUB_RUN_NUMBER))"
          EXPECTED_NAME="0.2.${GITHUB_RUN_NUMBER}"

          test "$PACKAGE_NAME" = "com.mm2ultimatehub.zunoapk" || { echo "::error::Unexpected package id: $PACKAGE_NAME"; exit 1; }
          test "$APK_VERSION_CODE" = "$EXPECTED_CODE" || { echo "::error::Expected versionCode $EXPECTED_CODE, got $APK_VERSION_CODE"; exit 1; }
          test "$APK_VERSION_NAME" = "$EXPECTED_NAME" || { echo "::error::Expected versionName $EXPECTED_NAME, got $APK_VERSION_NAME"; exit 1; }
          echo "Verified signed APK: $PACKAGE_NAME $APK_VERSION_NAME (versionCode $APK_VERSION_CODE)"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZUNO-APK-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK as a GitHub Release for in-app updates
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zuno-apk-0.2.${{ github.run_number }}
          name: ZUNO APK 0.2.${{ github.run_number }}
          body: |
            Automatically published signed ZUNO APK.
            Android versionCode is automatically increased for each build.
            Install over an existing app only when signed with the same release keystore.
          files: android/app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
